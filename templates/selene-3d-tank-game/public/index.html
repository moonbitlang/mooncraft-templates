<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonCraft 3D Tank</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    canvas { display: block; width: 100vw; height: 100vh; }
    [hidden] { display: none !important; }
    .webgpu-error {
      box-sizing: border-box;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e2e8f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .webgpu-error__panel {
      width: min(520px, 100%);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 24px 70px rgba(2, 6, 23, 0.36);
      padding: 28px;
    }
    .webgpu-error h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .webgpu-error p {
      margin: 0 0 16px;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.55;
    }
    .webgpu-error code {
      display: block;
      overflow-wrap: anywhere;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.9);
      color: #fecaca;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="webgpu-error" class="webgpu-error" role="alert" hidden>
    <div class="webgpu-error__panel">
      <h1>WebGPU is required</h1>
      <p>This template needs a browser and graphics adapter with WebGPU support.</p>
      <code data-reason></code>
    </div>
  </div>
  <script type="module">
    const canvas = document.getElementById("canvas");
    const errorView = document.getElementById("webgpu-error");
    const reasonView = errorView.querySelector("[data-reason]");

    function showWebGPUError(reason) {
      canvas.hidden = true;
      reasonView.textContent = reason;
      errorView.hidden = false;
    }

    async function getWebGPUError() {
      if (!("gpu" in navigator)) {
        return "navigator.gpu is unavailable.";
      }

      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          return "WebGPU adapter is unavailable.";
        }
      } catch (error) {
        if (error instanceof Error && error.message) {
          return error.message;
        }
        return "WebGPU adapter request failed.";
      }

      return "";
    }

    const webgpuError = await getWebGPUError();
    if (webgpuError) {
      showWebGPUError(webgpuError);
    } else {
      await import("./frontend.js");
    }
  </script>
</body>
</html>
