<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Presentation</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef1f4;
      color: #172026;
    }
    button, input { font: inherit; }
    button {
      border: 1px solid #c9d3da;
      border-radius: 6px;
      background: #ffffff;
      color: #172026;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    button:hover { border-color: #4f7f8a; transform: translateY(-1px); }
    button.secondary { align-self: flex-start; padding: 10px 14px; }
    button:disabled { cursor: wait; opacity: 0.6; }
    .workspace {
      height: 100vh;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
    }
    .sidebar {
      height: 100vh;
      background: #172026;
      color: #f6f8f8;
      padding: 20px;
      overflow: auto;
    }
    .sidebar header { margin-bottom: 18px; }
    .sidebar small { color: #9fb7bd; text-transform: uppercase; letter-spacing: 0; font-size: 12px; }
    .sidebar h2 { margin: 6px 0 0; font-size: 20px; line-height: 1.2; }
    .thumb-list { display: grid; gap: 10px; }
    .thumb {
      width: 100%;
      min-height: 132px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px;
      text-align: left;
      background: #223037;
      border-color: #34454d;
      color: #f6f8f8;
    }
    .thumb.active { border-color: #8bd6c7; background: #284047; }
    .thumb-number {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #8bd6c7;
      color: #172026;
      font-weight: 700;
      font-size: 12px;
    }
    .thumb-preview {
      min-width: 0;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      background: #ffffff;
    }
    .thumb-stage {
      width: 960px;
      height: 540px;
      transform: scale(0.193);
      transform-origin: top left;
      pointer-events: none;
    }
    .thumb-stage .slide {
      animation: none;
      box-shadow: none;
    }
    .thumb-stage input,
    .thumb-stage button {
      pointer-events: none;
    }
    .thumb-meta {
      grid-column: 2;
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .thumb strong {
      overflow: hidden;
      color: #f6f8f8;
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thumb small { font-size: 10px; color: #b8c8cc; }
    .stage-shell {
      min-width: 0;
      min-height: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      padding: 24px;
      gap: 14px;
    }
    .stage {
      width: min(100%, calc(100vh * 16 / 9 - 96px));
      aspect-ratio: 16 / 9;
      align-self: center;
      justify-self: center;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(23, 32, 38, 0.18);
      transform: scale(calc(var(--stage-zoom) / 100));
      transform-origin: center;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 72px;
      animation: slide-in 180ms ease;
    }
    .title-slide, .content-slide, .closing-slide, .quote-slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .object-slide {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(320px, 1fr);
      gap: 32px;
      align-items: center;
      background: #fcfbff;
    }
    .object-copy { min-width: 0; }
    mooncraft-word-viewer {
      display: block;
      width: 100%;
      min-height: 420px;
    }
    .object-preview-word {
      min-height: 420px;
      display: grid;
      place-items: center;
      border: 1px solid #ead4e3;
      border-radius: 8px;
      background: linear-gradient(145deg, #fff6fb 0%, #f2f5ff 100%);
      color: #ff5fb2;
      font-size: 76px;
      font-weight: 900;
      text-shadow: 0 3px 0 #d82f89, 0 18px 36px rgba(108, 30, 83, 0.22);
    }
    .title-slide {
      background: linear-gradient(135deg, #172026 0%, #30515a 48%, #8bd6c7 100%);
      color: #ffffff;
    }
    .closing-slide {
      background: #f7faf9;
      border-top: 12px solid #e85d75;
    }
    .quote-slide {
      background: #fff8f4;
      border-left: 14px solid #d95f43;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #d95f43;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 14px;
      font-weight: 800;
    }
    .title-slide .eyebrow { color: #8bd6c7; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 880px; font-size: 74px; line-height: 0.98; margin-bottom: 24px; }
    h2 { max-width: 820px; font-size: 48px; line-height: 1.04; margin-bottom: 16px; }
    .lead, .body-copy { max-width: 780px; font-size: 22px; line-height: 1.45; color: #52636b; }
    .title-slide .lead { color: #d9eeee; }
    .metrics-grid, .component-grid, .agenda-grid, .comparison-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0;
    }
    .agenda-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .comparison-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric, .component-tile, .agenda-item, .comparison-card {
      min-height: 136px;
      border: 1px solid #dae2e5;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fbfcfc;
    }
    .agenda-item {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      min-height: 98px;
    }
    .agenda-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #172026;
      color: #ffffff;
      font-weight: 800;
    }
    .comparison-card strong { font-size: 24px; line-height: 1.2; }
    .comparison-card span { font-size: 52px; font-weight: 800; color: #d95f43; }
    .metric strong { font-size: 42px; line-height: 1; }
    .trend { color: #23745f; font-weight: 700; }
    .simulation-slide {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 28px 48px;
      background: #ffffff;
    }
    .simulation-heading {
      border-left: 5px solid #4b8cff;
      padding-left: 14px;
    }
    .simulation-heading h2 {
      margin-bottom: 4px;
      font-size: 34px;
      line-height: 1.05;
    }
    .simulation-heading .body-copy {
      max-width: none;
      margin-bottom: 0;
      font-size: 16px;
    }
    .simulation-dashboard {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 2.05fr) minmax(300px, 1fr);
      gap: 16px;
    }
    .market-chart-card, .sim-card {
      border: 1px solid #dae2e5;
      border-radius: 8px;
      background: #ffffff;
    }
    .market-chart-card {
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: 12px 14px 8px;
    }
    .market-chart-svg {
      width: 100%;
      height: 100%;
      min-height: 260px;
    }
    .market-legend {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding-top: 8px;
      color: #475467;
      font-weight: 600;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .legend-line {
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: #4b8cff;
    }
    .legend-line.supply { background: #12b886; }
    .legend-line.equilibrium { width: 10px; height: 10px; background: #f59e0b; }
    .simulation-side {
      min-height: 0;
      display: grid;
      gap: 6px;
      font-size: 14px;
    }
    .sim-card {
      padding: 6px 12px;
    }
    .sim-card h3 {
      margin: 0 0 4px;
      color: #344054;
      font-size: 14px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .curve-control { display: grid; gap: 2px; margin-top: 4px; }
    .curve-control input {
      width: 100%;
      height: 14px;
      margin: 0;
    }
    .curve-label, .outcome-row, .equilibrium-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .curve-label strong { flex: 1; color: #344054; }
    .curve-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4b8cff;
    }
    .curve-dot.supply { background: #12b886; }
    .curve-value {
      min-width: 32px;
      border-radius: 6px;
      background: #f2f4f7;
      padding: 3px 8px;
      text-align: center;
      font-weight: 800;
    }
    .curve-control small { color: #8a98ae; font-size: 10px; }
    .equilibrium-card {
      border-color: #f6d365;
      background: #fffaf0;
    }
    .equilibrium-grid div {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .equilibrium-grid small { color: #d97706; font-size: 13px; }
    .equilibrium-grid strong {
      color: #7c2d12;
      font-size: 22px;
      line-height: 1;
    }
    .outcome-row {
      padding: 2px 0;
      color: #475467;
      border-bottom: 1px solid #edf1f5;
    }
    .outcome-row:last-child { border-bottom: 0; }
    .outcome-row strong { color: #475467; }
    .outcome-row.blue strong { color: #4b8cff; }
    .outcome-row.green strong { color: #009b72; }
    .outcome-section-label {
      display: block;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid #edf1f5;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      max-width: 620px;
      margin: 8px 0;
      font-weight: 700;
    }
    input[type="range"] { width: min(620px, 100%); accent-color: #d95f43; }
    .chart { display: grid; gap: 12px; max-width: 760px; margin-top: 24px; }
    .bar-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
    }
    .bar-track { height: 18px; border-radius: 999px; background: #dde6e8; overflow: hidden; }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #4f7f8a;
      transition: width 180ms ease;
    }
    .bar-fill.accent { background: #d95f43; }
    .bar-value { text-align: right; font-weight: 700; }
    .toolbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .toolbar button { min-width: 44px; height: 38px; padding: 0 12px; }
    .progress-readout {
      min-width: 180px;
      display: grid;
      grid-template-columns: 56px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
    }
    progress { width: 100%; accent-color: #4f7f8a; }
    .zoom { min-width: 48px; text-align: center; font-weight: 700; }
    .timer {
      min-width: 48px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #4f5f66;
    }
    .notes-panel {
      width: min(100%, 860px);
      justify-self: center;
      border: 1px solid #d7e0e3;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(23, 32, 38, 0.08);
    }
    .notes-panel small {
      display: block;
      margin-bottom: 4px;
      color: #64757c;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 11px;
      font-weight: 800;
    }
    .notes-panel p { margin: 0; color: #24343b; line-height: 1.4; }
    .error { justify-self: center; color: #9b1c1c; margin: 0; }
    @keyframes slide-in {
      from { opacity: 0.76; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
    @media (max-width: 840px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: 220px; }
      .thumb-list { grid-template-columns: repeat(5, minmax(160px, 1fr)); overflow-x: auto; }
      .thumb-stage { transform: scale(0.15); }
      .stage-shell { min-height: calc(100vh - 220px); padding: 14px; }
      .title-slide, .content-slide, .closing-slide, .quote-slide, .object-slide { padding: 32px; }
      h1 { font-size: 42px; }
      h2 { font-size: 32px; }
      .lead, .body-copy { font-size: 17px; }
      .metrics-grid, .component-grid, .agenda-grid, .comparison-grid, .simulation-dashboard { grid-template-columns: 1fr; }
      .object-slide { grid-template-columns: 1fr; }
      mooncraft-word-viewer { min-height: 240px; }
      .market-chart-svg { min-height: 260px; }
      .toolbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/object-viewer.js"></script>
  <script type="module" src="/frontend.js"></script>
</body>
</html>
