<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Presentation</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef1f4;
      color: #172026;
    }
    button, input { font: inherit; }
    button {
      border: 1px solid #c9d3da;
      border-radius: 6px;
      background: #ffffff;
      color: #172026;
      cursor: pointer;
    }
    button:hover { border-color: #4f7f8a; }
    button.secondary { align-self: flex-start; padding: 10px 14px; }
    button:disabled { cursor: wait; opacity: 0.6; }
    .workspace {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 0;
    }
    .sidebar {
      background: #172026;
      color: #f6f8f8;
      padding: 20px;
      overflow: auto;
    }
    .sidebar header { margin-bottom: 18px; }
    .sidebar small { color: #9fb7bd; text-transform: uppercase; letter-spacing: 0; font-size: 12px; }
    .sidebar h2 { margin: 6px 0 0; font-size: 20px; line-height: 1.2; }
    .thumb-list { display: grid; gap: 10px; }
    .thumb {
      width: 100%;
      min-height: 82px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 10px;
      text-align: left;
      background: #223037;
      border-color: #34454d;
      color: #f6f8f8;
    }
    .thumb.active { border-color: #8bd6c7; background: #284047; }
    .thumb-number {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #8bd6c7;
      color: #172026;
      font-weight: 700;
      font-size: 13px;
    }
    .thumb strong { font-size: 14px; line-height: 1.25; }
    .thumb small { grid-column: 2; font-size: 11px; color: #b8c8cc; }
    .stage-shell {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: 24px;
      gap: 14px;
    }
    .stage {
      width: min(100%, calc(100vh * 16 / 9 - 96px));
      aspect-ratio: 16 / 9;
      align-self: center;
      justify-self: center;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(23, 32, 38, 0.18);
      transform: scale(calc(var(--stage-zoom) / 100));
      transform-origin: center;
    }
    .title-slide, .content-slide, .closing-slide {
      width: 100%;
      height: 100%;
      padding: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .title-slide {
      background: linear-gradient(135deg, #172026 0%, #30515a 48%, #8bd6c7 100%);
      color: #ffffff;
    }
    .closing-slide {
      background: #f7faf9;
      border-top: 12px solid #e85d75;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #d95f43;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 14px;
      font-weight: 800;
    }
    .title-slide .eyebrow { color: #8bd6c7; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 880px; font-size: 74px; line-height: 0.98; margin-bottom: 24px; }
    h2 { max-width: 820px; font-size: 48px; line-height: 1.04; margin-bottom: 16px; }
    .lead, .body-copy { max-width: 780px; font-size: 22px; line-height: 1.45; color: #52636b; }
    .title-slide .lead { color: #d9eeee; }
    .metrics-grid, .component-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0;
    }
    .metric, .component-tile {
      min-height: 136px;
      border: 1px solid #dae2e5;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fbfcfc;
    }
    .metric strong { font-size: 42px; line-height: 1; }
    .trend { color: #23745f; font-weight: 700; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      max-width: 620px;
      margin: 8px 0;
      font-weight: 700;
    }
    input[type="range"] { width: min(620px, 100%); accent-color: #d95f43; }
    .chart { display: grid; gap: 12px; max-width: 760px; margin-top: 24px; }
    .bar-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
    }
    .bar-track { height: 18px; border-radius: 999px; background: #dde6e8; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: #4f7f8a; }
    .bar-value { text-align: right; font-weight: 700; }
    .toolbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .toolbar button { min-width: 44px; height: 38px; padding: 0 12px; }
    .progress-readout {
      min-width: 180px;
      display: grid;
      grid-template-columns: 56px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
    }
    progress { width: 100%; accent-color: #4f7f8a; }
    .zoom { min-width: 48px; text-align: center; font-weight: 700; }
    .error { justify-self: center; color: #9b1c1c; margin: 0; }
    @media (max-width: 840px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: 220px; }
      .thumb-list { grid-template-columns: repeat(5, minmax(160px, 1fr)); overflow-x: auto; }
      .stage-shell { min-height: calc(100vh - 220px); padding: 14px; }
      .title-slide, .content-slide, .closing-slide { padding: 32px; }
      h1 { font-size: 42px; }
      h2 { font-size: 32px; }
      .lead, .body-copy { font-size: 17px; }
      .metrics-grid, .component-grid { grid-template-columns: 1fr; }
      .toolbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/frontend.js"></script>
</body>
</html>
